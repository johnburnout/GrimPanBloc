; Réglages PHP du serveur de développement local.
; La Symfony CLI (symfony serve) lit automatiquement ce fichier à la racine du projet.
; Il ne sert pas en production : voir l'étape 3 de l'installation Apache dans le README.

; Photos jusqu'à 15 Mo (limite du formulaire), avec une marge pour le reste du formulaire
upload_max_filesize = 16M
post_max_size = 20M

; Redressement EXIF des grandes photos avec GD
memory_limit = 256M
