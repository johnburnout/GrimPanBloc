# Publie une release GitHub à chaque tag « vX.Y.Z ».
#
# 1. vérifie que le tag correspond au fichier VERSION ;
# 2. construit l'archive prête à installer (bin/construire-release.sh) ;
# 3. publie la release avec l'archive, son empreinte SHA-256 et les notes
#    tirées de CHANGELOG.md.
#
# Les sites déjà installés détectent la release (une fois par jour) et
# proposent la mise à jour en un clic à leurs administrateurs.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # Base des tests fonctionnels (grimpepan_test), même version qu'en production
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/grimpepan?serverVersion=11.8.6-MariaDB&charset=utf8mb4
    steps:
      - uses: actions/checkout@v5

      - name: Le tag correspond au fichier VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas au fichier VERSION ($version)."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, gd, exif, zip, pdo_mysql, mbstring, xml
          tools: composer:v2
          coverage: none

      - name: Vérifications
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          php bin/console lint:container --env=prod
          php bin/console lint:twig templates
          php bin/console lint:yaml config
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/phpunit

      - name: Archive de release
        run: bin/construire-release.sh build

      - name: Notes de version (CHANGELOG.md)
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { dedans = 1; next }
            dedans && /^## \[/   { exit }
            dedans               { print }
          ' CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then
            echo "::error::Aucune section « ## [$version] » dans CHANGELOG.md."
            exit 1
          fi

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/grimpanbloc-$GITHUB_REF_NAME.zip" \
            "build/grimpanbloc-$GITHUB_REF_NAME.zip.sha256" \
            "build/grimpepan-$GITHUB_REF_NAME.zip" \
            "build/grimpepan-$GITHUB_REF_NAME.zip.sha256" \
            --title "GrimPanBloc ${GITHUB_REF_NAME#v}" \
            --notes-file build/notes.md \
            --verify-tag
