framework:
    secret: '%env(APP_SECRET)%'
    default_locale: fr
    session: true
    csrf_protection: true
    form: true
    validation:
        enable_attributes: true
    assets:
        # css/app.css?v=<version> : le cache des navigateurs ne survit pas à une mise à jour
        version_strategy: App\Asset\VersionApplication

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
