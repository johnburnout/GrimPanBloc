security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|js|uploads)/
            security: false
        # Finalisation d'une mise à jour : exécutée par la NOUVELLE version avant les
        # migrations, donc sans recharger l'utilisateur depuis la base (son schéma n'est
        # peut-être pas encore à jour). Autorisée par le seul jeton de maintenance.
        mise_a_jour_finaliser:
            pattern: ^/admin/mise-a-jour/finaliser$
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_home
            # Limite les essais de mot de passe : 5 échecs par email et par IP en 5 min
            # (et 25 par IP, tous emails confondus). État stocké dans cache.rate_limiter.
            login_throttling:
                max_attempts: 5
                interval: '5 minutes'
            logout:
                path: app_logout
                target: app_home
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/profil, roles: ROLE_USER }
        - { path: ^/secteurs/nouveau, roles: ROLE_USER }
        - { path: ^/voies/nouvelle, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
