parameters:
    photos_dir: '%kernel.project_dir%/public/uploads/photos'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $photosDir: '%photos_dir%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/Kernel.php'
